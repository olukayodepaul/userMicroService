syntax = "proto3";
option java_package = "com.grpc.darts";
package grpc.details;

service DetailsService {
  rpc AddDetails (Details) returns (AddDetailsResponse){};
}

message Details {
  string uuid = 1;
  string first_name = 2;
  string last_name = 3;
  string phone_number = 4;
  string date_of_birth = 5;
  string gender = 6;
  string bio = 7;
}

message AddDetailsResponse {
  string status = 1;
  string message = 2;
}
